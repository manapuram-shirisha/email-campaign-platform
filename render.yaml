services:
  - type: web
    name: email-campaign-api
    runtime: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm db:generate && pnpm --filter api build
    startCommand: pnpm --filter api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ACCESS_TOKEN_MINUTES
        value: 15
      - key: REFRESH_TOKEN_DAYS
        value: 7
      - key: WEB_ORIGIN
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: ses
      - key: AWS_REGION
        value: ap-south-2
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: SES_CONFIGURATION_SET
        value: email-platform-events
      - key: SES_FROM_EMAIL
        sync: false
      - key: SES_SNS_TOPIC_ARN
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: SQS_SEND_QUEUE_URL
        sync: false
      - key: SQS_EVENTS_QUEUE_URL
        sync: false

  - type: worker
    name: email-campaign-worker
    runtime: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm db:generate && pnpm --filter worker build
    startCommand: pnpm --filter worker start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: ses
      - key: AWS_REGION
        value: ap-south-2
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: SES_CONFIGURATION_SET
        value: email-platform-events
      - key: SES_FROM_EMAIL
        sync: false
      - key: SQS_SEND_QUEUE_URL
        sync: false
      - key: SQS_EVENTS_QUEUE_URL
        sync: false
      - key: WORKER_MAX_RECEIVE_COUNT
        value: 5
